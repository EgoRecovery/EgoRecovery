# Cotrain data config for Recovery-Window-Conditioned Intent Bottleneck
# (docs/intent_head_cotrain.md, Mode 2-RW+SR variant).
#
# Default paths point to the merged 33-success+15-recovery robot zarr
# (with sr_label / recovery_intent_valid baked in by
# scripts/data_analysis/merge_recovery_success_zarr.py + apply step) and the
# 247-ep clean human recovery zarr. Override at the top-level via
#   aloha_data_path=<...> hand_data_path=<...>
# if you want to plug in a different dataset pair (e.g. for ablations).
#
# Differences vs cotrain_aloha_hand_intent.yaml:
#   - folder paths default to RW-ready zarrs
#   - keymap / transform args set include_rw_targets: true so
#     recovery_intent_valid + sr_label get exposed in the batch
#
# Pair with:
#   model=hpt_cotrain_aloha_hand_intent_rw
#   data_schematic=aloha_hand_intent_rw

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  aloha_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /path/to/dataset/t1_zarr_insertion_new_33_recovery_15_mask_lerobot_before_left_release_25fps_28D
      key_map:
        _target_: egomimic.rldb.embodiment.aloha.Aloha.get_keymap
        keymap_mode: joint
        include_intent_targets: true
        include_rw_targets: true
      transform_list:
        _target_: egomimic.rldb.embodiment.aloha.Aloha.get_transform_list
        mode: joint
        include_intent_targets: true
        include_rw_targets: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: []
    mode: train
    valid_ratio: 0.1
  hand_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /path/to/dataset/t1_zarr_human_hand_insertion_recovery_247_cut_5s_25fps_check
      key_map:
        _target_: egomimic.rldb.embodiment.hand_insertion.HandInsertion.get_keymap
        keymap_mode: ee
        include_intent_targets: true
        include_rw_targets: true
      transform_list:
        _target_: egomimic.rldb.embodiment.hand_insertion.HandInsertion.get_transform_list
        mode: ee
        include_intent_targets: true
        include_rw_targets: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: []
    mode: train
    valid_ratio: 0.1

valid_datasets:
  aloha_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /path/to/dataset/t1_zarr_insertion_new_33_recovery_15_mask_lerobot_before_left_release_25fps_28D
      key_map:
        _target_: egomimic.rldb.embodiment.aloha.Aloha.get_keymap
        keymap_mode: joint
        include_intent_targets: true
        include_rw_targets: true
      transform_list:
        _target_: egomimic.rldb.embodiment.aloha.Aloha.get_transform_list
        mode: joint
        include_intent_targets: true
        include_rw_targets: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: []
    mode: valid
    valid_ratio: 0.1
  hand_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /path/to/dataset/t1_zarr_human_hand_insertion_recovery_247_cut_5s_25fps_check
      key_map:
        _target_: egomimic.rldb.embodiment.hand_insertion.HandInsertion.get_keymap
        keymap_mode: ee
        include_intent_targets: true
        include_rw_targets: true
      transform_list:
        _target_: egomimic.rldb.embodiment.hand_insertion.HandInsertion.get_transform_list
        mode: ee
        include_intent_targets: true
        include_rw_targets: true
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas: []
    mode: valid
    valid_ratio: 0.1

train_dataloader_params:
  aloha_bimanual:
    batch_size: 64
    num_workers: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
  hand_bimanual:
    batch_size: 64
    num_workers: 4
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
valid_dataloader_params:
  aloha_bimanual:
    batch_size: 64
    num_workers: 2
    persistent_workers: true
  hand_bimanual:
    batch_size: 64
    num_workers: 2
    persistent_workers: true
