# DataSchematic for Recovery-Window-Conditioned Intent Bottleneck training
# (docs/intent_head_cotrain.md §A / §C / §D, Mode 2-RW+SR variant).
#
# Differs from aloha_hand_intent.yaml by adding two extra metadata keys per
# embodiment:
#   - recovery_intent_valid : bool mask, used by HPTModel._compute_intent_loss
#                             to AND with gt_intent_valid (so L_intent only
#                             supervises samples whose K-window lies inside a
#                             recovery phase).
#   - sr_label              : bool, supervised by HPTModel._compute_sr_loss
#                             via SRHead BCE.
#
# Both are written by scripts/data_analysis/apply_recovery_labels.py (or the
# combined merge script for the robot side). Like gt_intent_valid, they live
# in metadata_keys so DataSchematic does NOT z-score-normalize them.
#
# Pair with:
#   data=cotrain_aloha_hand_intent_rw          (sets include_rw_targets: true)
#   model=hpt_cotrain_aloha_hand_intent_rw     (registers sr_head + lambdas)
# or use train_hpt_aloha_intent_rw.yaml as the top-level entry.

_target_: egomimic.rldb.zarr.utils.DataSchematic
norm_mode: quantile
schematic_dict:
  aloha_bimanual:
    front_img_1:
      key_type: camera_keys
      zarr_key: observations.images.front_img_1
    left_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.left_wrist_img
    right_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.right_wrist_img
    joint_positions:
      key_type: proprio_keys
      zarr_key: observations.state.joint_positions
    actions_joints:
      key_type: action_keys
      zarr_key: actions_joints
    gt_intent:
      key_type: intent_keys
      zarr_key: gt_intent
    gt_intent_valid:
      key_type: metadata_keys
      zarr_key: gt_intent_valid
    recovery_intent_valid:
      key_type: metadata_keys
      zarr_key: recovery_intent_valid
    sr_label:
      key_type: metadata_keys
      zarr_key: sr_label
    embodiment:
      key_type: metadata_keys
      zarr_key: metadata.embodiment
  hand_bimanual:
    front_img_1:
      key_type: camera_keys
      zarr_key: observations.images.front_img_1
    left_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.left_wrist_img
    right_wrist_img:
      key_type: camera_keys
      zarr_key: observations.images.right_wrist_img
    ee_pose:
      key_type: proprio_keys
      zarr_key: observations.state.ee_pose
    actions_ee:
      key_type: action_keys
      zarr_key: actions_ee
    gt_intent:
      key_type: intent_keys
      zarr_key: gt_intent
    gt_intent_valid:
      key_type: metadata_keys
      zarr_key: gt_intent_valid
    recovery_intent_valid:
      key_type: metadata_keys
      zarr_key: recovery_intent_valid
    sr_label:
      key_type: metadata_keys
      zarr_key: sr_label
    embodiment:
      key_type: metadata_keys
      zarr_key: metadata.embodiment
