defaults:
  - model: act_aloha
  - visualization: aloha_joint
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb
  - data: aloha
  - callbacks: checkpoints
  - data_schematic: aloha
  - evaluator: eval_video
  - override hydra/launcher: submitit
  - _self_

name: act_aloha
description: default
ckpt_path: null
mode: train

hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 8
  nodes: 1

seed: 42

norm_stats:
  sample_frac: 1.0
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
reject_outliers: false
