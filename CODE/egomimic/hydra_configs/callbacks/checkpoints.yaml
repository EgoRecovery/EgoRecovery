defaults:
  - defaults
  - _self_

model_checkpoint:
  _target_: egomimic.utils.async_checkpoint.AsyncCopyModelCheckpoint
  # Final NAS destination. AsyncCopyModelCheckpoint writes to local_stage_dir
  # first and mirrors here; using paths.nas_output_dir (not output_dir) keeps
  # checkpoints off the staging tmpfs so they don't get double-mirrored.
  dirpath: ${paths.nas_output_dir}/checkpoints
  local_stage_dir: /dev/shm/ckpt_stage
  filename: "step_{step}"
  save_last: true
  save_top_k: -1
  every_n_train_steps: 10000
